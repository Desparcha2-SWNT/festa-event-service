# CD de festa-event-service (SCRUM-45), igual que festa-auth-service.
# Construye la imagen y la publica en GitHub Container Registry (GHCR). El despliegue real en
# AWS se agrega como un paso adicional cuando llegue el laboratorio de créditos (SCRUM-134).
#
# El Dockerfile corre las pruebas (incluida la de contrato) y copia los contratos a la imagen,
# porque el inbox los usa en runtime: por eso se descargan de festa-infra como build-context.
#
# Publica solo cuando corre por un push real a `main`. En un PR o al lanzarlo a mano
# (workflow_dispatch) solo construye la imagen, para validar el Dockerfile sin publicar nada.
name: CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [develop, main]
    paths:
      - Dockerfile
      - .dockerignore
      - package.json
      - package-lock.json
      - src/**
      - migrations/**
      - .github/workflows/cd.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  imagen:
    name: Build y publicar imagen en GHCR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # TODO: cambiar a ref: main cuando festa-infra cierre su primer sprint con un PR
      # develop → main (hoy main solo tiene el README).
      - name: Descargar contratos de festa-infra
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Desparcha2-SWNT/festa-infra
          ref: develop
          path: .festa-infra
          sparse-checkout: contracts

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: ¿Publicar esta ejecución?
        id: publicar
        run: echo "si=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}" >> "$GITHUB_OUTPUT"

      - name: Iniciar sesión en GHCR
        if: steps.publicar.outputs.si == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadatos de la imagen
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/desparcha2-swnt/festa-event-service
          tags: |
            type=sha
            type=raw,value=latest,enable=${{ steps.publicar.outputs.si }}

      - name: Build (y publicar si corresponde)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          build-contexts: |
            contracts=.festa-infra/contracts
          push: ${{ steps.publicar.outputs.si == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
